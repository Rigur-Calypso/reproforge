[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reproforge"
version = "0.1.0"
description = "Evidence-backed reproduction tests for Python crash reports"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["certifi"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]

[project.scripts]
reproforge = "reproforge.cli:main"

[tool.setuptools.packages.find]
include = ["reproforge*"]
