#cloud-config
# ==============================================================================
# ReproForge DigitalOcean Droplet Cloud-Init Configuration
# Paste this into the "User Data" field when launching a DigitalOcean Droplet.
# ==============================================================================

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - git
  - gnupg
  - lsb-release
  - python3
  - python3-venv
  - python3-pip

runcmd:
  # 1. Install Docker Engine
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update -qq
  - apt-get install -y -qq docker-ce docker-ce-cli containerd.io
  - systemctl enable --now docker

  # 2. Clone ReproForge Repository
  - mkdir -p /opt
  - git clone https://github.com/Rigur-Calypso/reproforge.git /opt/reproforge
  - cd /opt/reproforge

  # 3. Build Worker Docker Images
  - docker build -t reproforge-worker:py313 -f /opt/reproforge/worker/Dockerfile /opt/reproforge/worker
  - docker build -t reproforge-worker:httpx -f /opt/reproforge/worker/Dockerfile.httpx /opt/reproforge/worker
  - docker build -t reproforge-worker:py38 -f /opt/reproforge/worker/Dockerfile.py38 /opt/reproforge/worker

  # 4. Set up Python Virtual Environment
  - python3 -m venv /opt/reproforge/.venv
  - /opt/reproforge/.venv/bin/pip install --upgrade pip
  - /opt/reproforge/.venv/bin/pip install -e "/opt/reproforge[dev]"

  # 5. Register and Start ReproForge Systemd Service
  - cp /opt/reproforge/deploy/reproforge.service /etc/systemd/system/reproforge.service
  - systemctl daemon-reload
  - systemctl enable --now reproforge.service

final_message: "ReproForge cloud server initialized and running on port 8080."
